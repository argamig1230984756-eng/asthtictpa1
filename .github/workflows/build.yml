name: Build AestheticTPA

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build with Maven
        run: mvn -B clean package

      - name: Upload plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: AestheticTPA
          path: target/AestheticTPA-*.jar
          if-no-files-found: error

      # Pushing a tag like v1.0.1 also publishes a GitHub Release with the jar
      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: target/AestheticTPA-*.jar
